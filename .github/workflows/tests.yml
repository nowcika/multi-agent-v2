name: Example tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  csv-totals:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s examples/csv-totals -p 'test_*.py' -v
